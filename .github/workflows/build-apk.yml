name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Gradle variant to assemble'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble ${{ github.event.inputs.build_variant || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve variant
        id: variant
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.build_variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble APK
        run: ./gradlew --no-daemon assemble${{ steps.variant.outputs.name == 'release' && 'Release' || 'Debug' }}

      - name: Stage APK into dist/
        id: stage
        run: |
          set -euo pipefail
          VARIANT="${{ steps.variant.outputs.name }}"
          if [ "$VARIANT" = "release" ]; then
            SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
            OUT="dist/ZendoLauncher-release-unsigned.apk"
          else
            SRC="app/build/outputs/apk/debug/app-debug.apk"
            OUT="dist/ZendoLauncher-debug.apk"
          fi
          if [ ! -f "$SRC" ]; then
            echo "::error::Expected APK not found at $SRC"
            find app/build/outputs -name '*.apk' || true
            exit 1
          fi
          mkdir -p dist
          cp "$SRC" "$OUT"
          SIZE=$(stat -c %s "$OUT")
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # Structural sanity check: the artifact must be a readable ZIP that
          # actually contains a manifest, not a truncated or empty file.
          unzip -l "$OUT" | grep -q 'AndroidManifest.xml' || { echo "::error::APK does not contain AndroidManifest.xml"; exit 1; }
          echo "### APK built: $OUT" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| field | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| variant | $VARIANT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| version | $(grep -m1 versionName app/build.gradle \| tr -d ' ' \| cut -d"'" -f2) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| size | $SIZE bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| sha256 | \`$SHA\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| commit | \`${GITHUB_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: zendo-launcher-${{ steps.variant.outputs.name }}-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Attach APK to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check for signing credentials
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured. Skipping signed release build. See docs/build-and-release.md."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"

      - name: Write keystore.properties
        if: steps.signing.outputs.available == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/signing/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble signed release APK
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew --no-daemon assembleRelease

      - name: Stage release APK
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/release/app-release.apk"
          [ -f "$SRC" ] || { echo "::error::Signed release APK not found at $SRC"; exit 1; }
          mkdir -p dist
          cp "$SRC" "dist/ZendoLauncher-release.apk"
          sha256sum "dist/ZendoLauncher-release.apk"

      - name: Create GitHub Release and attach APK
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/ZendoLauncher-release.apk \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Fail loudly when signing is unconfigured
        if: steps.signing.outputs.available != 'true'
        run: |
          echo "::error::Tagged release ${GITHUB_REF_NAME} was not published: release signing secrets are missing."
          echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD, then re-run this workflow."
          echo "The debug APK from the build job remains available as a workflow artifact."
          exit 1
