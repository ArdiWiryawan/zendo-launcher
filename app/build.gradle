plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasReleaseSigning = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.zendolauncher'
    compileSdk 36

    defaultConfig {
        applicationId 'com.zendolauncher'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.2.4'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        // The About line reads BuildConfig.VERSION_NAME rather than a literal, so it cannot
        // drift from defaultConfig the way the hardcoded "0.2.0" did.
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    lint {
        abortOnError false
        // ObsoleteSdkInt suggests merging mipmap-anydpi-v26 into mipmap-anydpi
        // because minSdk is 26. That is wrong here: AAPT does not resolve
        // <adaptive-icon> from a plain mipmap-anydpi folder, and following the
        // advice breaks resource linking with "resource mipmap/ic_launcher not
        // found". The -v26 qualifier is required.
        disable += ['ObsoleteSdkInt']
    }

    testOptions {
        unitTests {
            includeAndroidResources = true

            all {
                // Robolectric 4.17 on JDK 21 needs these module openings for its
                // FileDescriptor interception and native runtime.
                jvmArgs(
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.security=ALL-UNNAMED',
                    '--add-opens=java.base/java.text=ALL-UNNAMED',
                    '--add-opens=java.base/java.nio=ALL-UNNAMED',
                    '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                    '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
                    '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
                    '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.util=ALL-UNNAMED',
                    '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
                    '--add-opens=java.base/sun.security.x509=ALL-UNNAMED',
                )
                // Robolectric derives the android-all jar path from a
                // percent-encoded file: URL, so a space in the local Maven
                // repository path becomes a literal %20 and the jar is never
                // found. C:/robo-local is a junction to the real ~/.m2/repository
                // made for that reason. When the junction is absent (a home
                // directory without a space) Robolectric resolves normally, so
                // this stays portable.
                if (file('C:/robo-local').exists()) {
                    systemProperty 'maven.repo.local', 'C:/robo-local'
                }
            }
        }
    }
}

dependencies {
    // Pinned deliberately. The newer versions lint suggests (compose-bom 2026.09.00,
    // core-ktx 1.19.1) both require compileSdk 37 and AGP 9.1.0; this project is on
    // compileSdk 36 and AGP 8.13.2, so they fail the build outright. Bump the toolchain
    // first, then these. The lint GradleDependency warnings are expected until then.
    implementation platform('androidx.compose:compose-bom:2026.06.01')

    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'

    // Test-only: runs the real Compose UI on the JVM through Robolectric.
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
